name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build release artifacts
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\pack-release.ps1
          Get-ChildItem release -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ninja-webhook-release
          path: |
            release/WebhookReceiver.exe
            release/WebhookTradeListener-AddOn.zip
            release/NinjaWebhook-Setup.exe
            release/NinjaWebhook-Portable.zip
